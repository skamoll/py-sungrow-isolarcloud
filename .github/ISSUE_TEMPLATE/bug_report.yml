name: Bug Report
description: Report a bug or unexpected behavior in py-sungrow-isolarcloud
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Python & Package Version
      placeholder: "e.g. Python 3.13.1, py-sungrow-isolarcloud 0.1.0"
    validations:
      required: true
  - type: dropdown
    id: gateway
    attributes:
      label: Regional Gateway
      options:
        - auto
        - eu
        - com
        - au
        - hk
        - cn
        - in
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Minimal Reproduction & Logs
      description: Please redact any email addresses, passwords, tokens, plant IDs, or serial numbers.
      render: text
