name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "SemVer part to bump"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump version, commit, and tag
        run: |
          NEW_VER=$(python3 - << 'EOF'
          import re
          from pathlib import Path

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          m = re.search(r'^version\s*=\s*"(\d+)\.(\d+)\.(\d+)"', text, re.MULTILINE)
          assert m, "Version not found in pyproject.toml"
          major, minor, patch = map(int, m.groups())
          bump = "${{ inputs.bump }}"
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          else:
              patch += 1
          new_ver = f"{major}.{minor}.{patch}"
          pyproject.write_text(
              re.sub(r'^version\s*=\s*"\d+\.\d+\.\d+"', f'version = "{new_ver}"', text, count=1, flags=re.MULTILINE),
              encoding="utf-8",
          )
          print(new_ver)
          EOF
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore(release): v${NEW_VER}"
          git tag "v${NEW_VER}"
          git push origin main "v${NEW_VER}"
